<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10140f">
<title>TRU SHELF</title>
<style>
:root{--bg:#10140f;--ink:#e7f0dc;--dim:#a8b89a;--line:#2c3824;--leaf:#c6d86a;--card:#1a2216}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
header{padding:18px 16px 8px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--leaf)}
.sub{color:var(--dim);font-size:14px}
main{padding:8px 16px 32px} a{color:inherit;text-decoration:none}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--leaf);font-size:12px;letter-spacing:.12em}
.big{font-size:20px;margin:2px 0}
.src{color:var(--dim);font-size:13px}
</style>
</head>
<body>
<header><h1>TRU <span>SHELF</span></h1><p class="sub">Public offline lanes. One file each. No network after the page is saved. A gap is a gap.</p></header>
<main id="out"></main>
<script>
const LANES=[
{n:"Canonbound",w:"The Word. KJV, offline, canon-bound.",u:"https://github.com/splashdown1/tru-canonbound",p:"https://splashdown1.github.io/tru-canonbound/"},
{n:"Lifeline",w:"Body. FM 21-76 Survival 1970 and FM 21-11 First Aid 1976.",u:"https://github.com/splashdown1/tru-lifeline",p:"https://splashdown1.github.io/tru-lifeline/"},
{n:"Signal",w:"Be found. Distress, phonetic, Morse, ground-to-air panels.",u:"https://github.com/splashdown1/tru-signal",p:"https://splashdown1.github.io/tru-signal/"},
{n:"Pantry",w:"Food that keeps. USDA process times and altitude only.",u:"https://github.com/splashdown1/tru-pantry",p:"https://splashdown1.github.io/tru-pantry/"},
{n:"Mark",w:"Find north, pace a distance, read a scale.",u:"https://github.com/splashdown1/tru-mark",p:"https://splashdown1.github.io/tru-mark/"},
{n:"Measure",w:"Units, kitchen, temperature, time. Arithmetic only.",u:"https://github.com/splashdown1/tru-measure",p:"https://splashdown1.github.io/tru-measure/"},
{n:"Cord",w:"Six knots that hold a load, a join, or a loop.",u:"https://github.com/splashdown1/tru-cord",p:"https://splashdown1.github.io/tru-cord/"}
];
document.getElementById("out").innerHTML=LANES.map(x=>`<a class="card" href="${x.u}"><div class="k">LANE</div><div class="big">${x.n}</div><div>${x.w}</div><div class="src">Repo ${x.u.replace("https://github.com/","")} · page ${x.p}</div></a>`).join("")+`<article class="card"><div class="k">SPACE</div><div class="big">One account is enough</div><div>GitHub does not meter public repositories. A single file over 100 MB is the wall, not the number of lanes. Save each page to the phone and it works with the radio off.</div></article>`;
</script>
</body>
</html>
