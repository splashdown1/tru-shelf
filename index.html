<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10140f">
<title>TRU SHELF</title>
<style>
:root{--bg:#10140f;--ink:#e7f0dc;--dim:#a8b89a;--line:#2c3824;--leaf:#c6d86a;--card:#1a2216}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
header{padding:18px 16px 8px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--leaf)}
.sub{color:var(--dim);font-size:14px}
main{padding:8px 16px 32px} a{color:inherit;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.lane{display:block}
.k{color:var(--leaf);font-size:12px;letter-spacing:.12em}
.big{font-size:20px;margin:2px 0}
.src{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px}
.src a{display:inline-flex;align-items:center;min-height:32px;color:var(--dim);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.src .page{color:var(--leaf)}
a:focus-visible{outline:2px solid var(--leaf);outline-offset:3px;border-radius:4px}
</style>
</head>
<body>
<header><h1>TRU <span>SHELF</span></h1><p class="sub">Public offline lanes. One file each. No network after the page is saved. A gap is a gap.</p></header>
<main id="out"></main>
<script>
const LANES=[
{k:"LANE",n:"Canonbound",w:"The Word. KJV, offline, canon-bound.",u:"https://github.com/splashdown1/tru-canonbound",p:"https://splashdown1.github.io/tru-canonbound/"},
{k:"LANE",n:"Lifeline",w:"Body. FM 21-76 Survival 1970 and FM 21-11 First Aid 1976.",u:"https://github.com/splashdown1/tru-lifeline",p:"https://splashdown1.github.io/tru-lifeline/"},
{k:"LANE",n:"Signal",w:"Be found. Distress, phonetic, Morse, ground-to-air panels.",u:"https://github.com/splashdown1/tru-signal",p:"https://splashdown1.github.io/tru-signal/"},
{k:"LANE",n:"Pantry",w:"Food that keeps. USDA process times and altitude only.",u:"https://github.com/splashdown1/tru-pantry",p:"https://splashdown1.github.io/tru-pantry/"},
{k:"LANE",n:"Mark",w:"Find north, pace a distance, read a scale.",u:"https://github.com/splashdown1/tru-mark",p:"https://splashdown1.github.io/tru-mark/"},
{k:"LANE",n:"Measure",w:"Units, kitchen, temperature, time. Arithmetic only.",u:"https://github.com/splashdown1/tru-measure",p:"https://splashdown1.github.io/tru-measure/"},
{k:"LANE",n:"Cord",w:"Six knots that hold a load, a join, or a loop.",u:"https://github.com/splashdown1/tru-cord",p:"https://splashdown1.github.io/tru-cord/"},
{k:"LANE",n:"Wind",w:"Beaufort 0\u201312 from what you can see. Not a forecast.",u:"https://github.com/splashdown1/tru-wind",p:"https://splashdown1.github.io/tru-wind/"},
{k:"LANE",n:"Water",w:"Emergency disinfection. EPA doses only. Settle first.",u:"https://github.com/splashdown1/tru-water",p:"https://splashdown1.github.io/tru-water/"},
{k:"LANE",n:"Sky",w:"Polaris, moon phase, Orion. No planet positions.",u:"https://github.com/splashdown1/tru-sky",p:"https://splashdown1.github.io/tru-sky/"},
{k:"LANE",n:"Astro",w:"AU, light-year, seasons, eclipse geometry. No date.",u:"https://github.com/splashdown1/tru-astro",p:"https://splashdown1.github.io/tru-astro/"},
{k:"LANE",n:"Carrington",w:"1 September 1859. Flare, storm, telegraph. No modern toll.",u:"https://github.com/splashdown1/tru-carrington",p:"https://splashdown1.github.io/tru-carrington/"},
{k:"LANE",n:"Rack",w:"What a data hall is, and what a saved file still does.",u:"https://github.com/splashdown1/tru-rack",p:"https://splashdown1.github.io/tru-rack/"},
{k:"LANE",n:"Clock",w:"Device local time and UTC. The face the other lanes share.",u:"https://github.com/splashdown1/tru-clock",p:"https://splashdown1.github.io/tru-clock/"},
{k:"LANE",n:"Build",w:"Order of work, square, brace. No span table.",u:"https://github.com/splashdown1/tru-build",p:"https://splashdown1.github.io/tru-build/"},
{k:"LANE",n:"Wire",w:"US neutral and ground colors. Shut off. No breaker size.",u:"https://github.com/splashdown1/tru-wire",p:"https://splashdown1.github.io/tru-wire/"},
{k:"LANE",n:"Drain",w:"IPC slope, trap, vent. Sewage downhill. No septic size.",u:"https://github.com/splashdown1/tru-drain",p:"https://splashdown1.github.io/tru-drain/"},
{k:"LANE",n:"Fleet",w:"A ship, a fleet, a harbor. Not bots.",u:"https://github.com/splashdown1/tru-fleet",p:"https://splashdown1.github.io/tru-fleet/"},
{k:"LANE",n:"Speaks",w:"Reads a packed line aloud. Does not listen.",u:"https://github.com/splashdown1/tru-speaks",p:"https://splashdown1.github.io/tru-speaks/"},
{k:"LANE",n:"Speak",w:"Fixed Pashto lines. Not a translator.",u:"https://github.com/splashdown1/tru-speak",p:"https://splashdown1.github.io/tru-speak/"},
{k:"LANE",n:"Fire",w:"FM 21-76 site, fuel ladder, dead out. No friction-fire recipe.",u:"https://github.com/splashdown1/tru-fire",p:"https://splashdown1.github.io/tru-fire/"},
{k:"LANE",n:"Nav",w:"Direction plus distance. Back azimuth. No guessed declination.",u:"https://github.com/splashdown1/tru-nav",p:"https://splashdown1.github.io/tru-nav/"},
{k:"LANE",n:"Shelter",w:"Site, size, poncho lean-to. No snow cave.",u:"https://github.com/splashdown1/tru-shelter",p:"https://splashdown1.github.io/tru-shelter/"},
{k:"LANE",n:"Ford",w:"Channels, upstream pole, 45-degree course. No raft.",u:"https://github.com/splashdown1/tru-ford",p:"https://splashdown1.github.io/tru-ford/"},
{k:"LANE",n:"Cold",w:"Clean, avoid overheating, loose layers, dry. No treatment.",u:"https://github.com/splashdown1/tru-cold",p:"https://splashdown1.github.io/tru-cold/"},
{k:"LANE",n:"Wash",w:"Hands, cat hole, latrine below the water. No soap formula.",u:"https://github.com/splashdown1/tru-wash",p:"https://splashdown1.github.io/tru-wash/"},
{k:"LANE",n:"Blade",w:"Stone, oil, sheath. No steel recipe.",u:"https://github.com/splashdown1/tru-blade",p:"https://splashdown1.github.io/tru-blade/"},
{k:"LANE",n:"Watch",w:"One awake, a relief, a challenge word. Not a sentry manual.",u:"https://github.com/splashdown1/tru-watch",p:"https://splashdown1.github.io/tru-watch/"},
{k:"LANE",n:"Load",w:"Heavy high and close. Hip belt. Rain can double it. No pound table.",u:"https://github.com/splashdown1/tru-load",p:"https://splashdown1.github.io/tru-load/"},
{k:"LANE",n:"Code",w:"One file. Words, look, steps. A gap when you do not know.",u:"https://github.com/splashdown1/tru-code",p:"https://splashdown1.github.io/tru-code/"},
{k:"LANE",n:"AI",w:"Ask for the source. A gap stays a gap. The reply is not a witness.",u:"https://github.com/splashdown1/tru-ai",p:"https://splashdown1.github.io/tru-ai/"},
{k:"LANE",n:"Place",w:"Type a packed city. Get the coordinate. Not a map.",u:"https://github.com/splashdown1/tru-place",p:"https://splashdown1.github.io/tru-place/"},
{k:"LANE",n:"Sun",w:"Remaining light from a clear horizon. Not a clock.",u:"https://github.com/splashdown1/tru-sun",p:"https://splashdown1.github.io/tru-sun/"},
{k:"LANE",n:"Salt",w:"Draws water out. Seawater is not a drink. No cure schedule.",u:"https://github.com/splashdown1/tru-salt",p:"https://splashdown1.github.io/tru-salt/"},
{k:"LANE",n:"Quiet",w:"Light, sound, smoke. What gives you away. Not a sentry manual.",u:"https://github.com/splashdown1/tru-quiet",p:"https://splashdown1.github.io/tru-quiet/"},
{k:"LANE",n:"Fish",w:"Where they hold, bait, line. No poison.",u:"https://github.com/splashdown1/tru-fish",p:"https://splashdown1.github.io/tru-fish/"},
{k:"NOT A LANE",n:"Rules",w:"The lane law. One file. A gap stays a gap.",u:"https://github.com/splashdown1/tru-rules",p:"https://splashdown1.github.io/tru-rules/"},
{k:"NOT A LANE",n:"Door",w:"Points the ask at the ship that holds the card. A miss is a gap.",u:"https://github.com/splashdown1/tru-door",p:"https://splashdown1.github.io/tru-door/"},
{k:"NOT A LANE",n:"Join",w:"A folder, not a fusion. Talk, reason, law. No spirit vector.",u:"https://github.com/splashdown1/tru-join",p:"https://splashdown1.github.io/tru-join/"},
{k:"NOT A LANE",n:"Radio",w:"On, it can read the ships. Off, it cannot.",u:"https://github.com/splashdown1/tru-radio",p:"https://splashdown1.github.io/tru-radio/"},
{k:"NOT A LANE",n:"Harbor",w:"Reads the public ships. Needs the radio. Not a lane.",u:"https://github.com/splashdown1/tru-harbor",p:"https://splashdown1.github.io/tru-harbor/"}
];
document.getElementById("out").innerHTML=LANES.map(x=>`<article class="card"><a class="lane" href="${x.p}" aria-label="Open ${x.n}"><div class="k">${x.k}</div><div class="big">${x.n}</div><div>${x.w}</div></a><div class="src"><a href="${x.u}">Repository: ${x.u.replace("https://github.com/","")}</a><a class="page" href="${x.p}">Open ${x.n} \u2192</a></div></article>`).join("")+`<article class="card"><div class="k">NOT ON THE SHELF</div><div class="big">Rival and Sight</div><div>Rival governs and does not cite. Sight is pinned, not built. Neither is a lane.</div><div class="src"><a href="https://github.com/splashdown1/tru-rival">Repository: splashdown1/tru-rival</a><a href="https://github.com/splashdown1/tru-sight">Repository: splashdown1/tru-sight</a></div></article>`+`<article class="card"><div class="k">SPACE</div><div class="big">One account is enough</div><div>GitHub does not meter public repositories. A single file over 100 MB is the wall, not the number of lanes. Save each page to the phone and it works with the radio off.</div></article>`;
</script>
</body>
</html>
